<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugsy BD - Smart Gadget Store</title>
  
  <!-- SEO & Author Meta Tags -->
  <meta name="description" content="Welcome to Plugsy BD! Discover smart gadgets at great prices.">
  <meta name="author" content="Plugsy BD">
  
  <!-- Open Graph Meta Tags for Facebook & Social Sharing -->
  <meta property="og:title" content="Plugsy BD - Smart Gadget Store">
  <meta property="og:description" content="Welcome to Plugsy BD! Discover smart gadgets at great prices.">
  <meta property="og:url" content="https://bhadon200.github.io/Plugsy-BD/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://bhadon200.github.io/Plugsy-BD/assets/logo.png">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Plugsy BD - Smart Gadget Store">
  <meta name="twitter:description" content="Welcome to Plugsy BD! Discover smart gadgets at great prices.">
  <meta name="twitter:image" content="https://bhadon200.github.io/Plugsy-BD/assets/logo.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #121620;
      --accent-neon: #00f0ff;
      --accent-purple: #7000ff;
      --accent-pink: #ff007f;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --glow-blue: rgba(0, 240, 255, 0.4);
      --glow-purple: rgba(112, 0, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', 'Orbitron', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Animated Canvas Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 0;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-neon), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 0 15px var(--glow-blue);
      animation: pulse 3s infinite alternate;
    }

    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, var(--accent-neon), #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--glow-blue);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      font-size: 16px;
      text-decoration: none;
    }

    .icon-btn:hover {
      background: var(--accent-neon);
      color: #000;
      box-shadow: 0 0 15px var(--accent-neon);
      transform: translateY(-2px);
    }

    .social-btn-fb:hover {
      background: #1877f2;
      color: #fff;
      border-color: #1877f2;
      box-shadow: 0 0 15px rgba(24, 119, 242, 0.6);
    }

    .social-btn-insta:hover {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
      border-color: #e6683c;
      box-shadow: 0 0 15px rgba(220, 39, 67, 0.6);
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--accent-pink);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px var(--accent-pink);
    }

    /* Hero Banner */
    .hero {
      margin: 30px 0;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(112, 0, 255, 0.2), rgba(0, 240, 255, 0.1));
      border: 1px solid rgba(0, 240, 255, 0.25);
      padding: 40px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.1);
    }

    .hero-content {
      max-width: 600px;
      z-index: 2;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-neon);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--accent-neon);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-title {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    /* Section Title */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 40px 0 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }

    .section-title i {
      color: var(--accent-neon);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px;
      position: relative;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .product-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-neon);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
    }

    .badge-discount {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--accent-pink);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      z-index: 2;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    .product-img-wrap {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      background: #080a0e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-img-wrap img {
      transform: scale(1.08);
    }

    .product-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .product-price-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 15px;
    }

    .current-price {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-neon);
      font-family: 'Orbitron', sans-serif;
    }

    .old-price {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, var(--accent-neon), var(--accent-purple));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 20px var(--glow-blue);
    }

    /* Modal Styling */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 20px;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-neon);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--accent-pink);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: var(--accent-neon);
      box-shadow: 0 0 10px var(--glow-blue);
    }

    /* Cart Items List */
    .cart-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cart-item img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-title {
      font-size: 14px;
      font-weight: 600;
    }

    .cart-item-price {
      font-size: 13px;
      color: var(--accent-neon);
    }

    .cart-qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Admin Tabs */
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      padding: 10px 15px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .tab-btn.active {
      color: var(--accent-neon);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-neon);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Order Table */
    .order-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      color: var(--accent-neon);
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--accent-neon);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px var(--glow-blue);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Footer */
    footer {
      background: #06080b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 40px 0 20px;
      margin-top: 60px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      margin-bottom: 30px;
    }

    .footer-col h4 {
      color: #fff;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .footer-social-links {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .footer-bottom {
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        text-align: center;
        padding: 30px 20px;
      }

      .hero-title {
        font-size: 28px;
      }

      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 15px;
      }

      .product-card {
        padding: 12px;
      }

      .product-img-wrap {
        height: 140px;
      }

      .product-title {
        font-size: 14px;
      }

      .current-price {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="#" class="logo-container">
        <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
        <div class="logo-text">PLUGSY BD</div>
      </a>
      
      <div class="nav-actions">
        <!-- Facebook Page Link -->
        <a href="https://www.facebook.com/share/1DBzxjbHqj/?mibextid=wwXIfr" target="_blank" class="icon-btn social-btn-fb" title="আমাদের ফেসবুক পেজ">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <!-- Instagram Link -->
        <a href="#" target="_blank" class="icon-btn social-btn-insta" title="আমাদের ইনস্টাগ্রাম">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <button class="icon-btn" onclick="openAdminModal()" title="অ্যাডমিন প্যানেল">
          <i class="fa-solid fa-gear"></i>
        </button>
        <button class="icon-btn" onclick="openCartModal()" title="কার্ট">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Hero Banner -->
    <section class="hero">
      <div class="hero-content">
        <span class="hero-tag">স্মার্ট গ্যাজেট জোন</span>
        <h1 class="hero-title">আপনার দৈনন্দিন জীবনের জন্য সেরা গ্যাজেট</h1>
        <p class="hero-desc">প্রিমিয়াম কোয়ালিটি এবং সাশ্রয়ী মূল্যে অরিজিনাল টেক প্রোডাক্ট কিনুন Plugsy BD থেকে। দ্রুত হোম ডেলিভারি সার্ভিস।</p>
      </div>
    </section>

    <!-- Products Section -->
    <section>
      <div class="section-header">
        <h2 class="section-title"><i class="fa-solid fa-fire"></i> ট্রেন্ডিং গ্যাজেটসমূহ</h2>
      </div>

      <div class="product-grid" id="product-container">
        <!-- Dynamic Products Inserted via JS -->
      </div>
    </section>
  </main>

  <!-- Cart Modal -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fa-solid fa-bag-shopping"></i> শপিং কার্ট</h3>
        <button class="close-btn" onclick="closeModal('cart-modal')">&times;</button>
      </div>

      <div id="cart-items-wrapper">
        <!-- Cart Items Go Here -->
      </div>

      <div style="margin-top:20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
        <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:15px; font-size: 16px;">
          <span>মোট খরচ:</span>
          <span id="cart-total" style="color:var(--accent-neon)">৳ 0</span>
        </div>
        <button class="btn-primary" onclick="openCheckoutModal()" id="checkout-btn" disabled>
          অর্ডার নিশ্চিত করুন <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fa-solid fa-truck-fast"></i> ডেলিভারি তথ্য দিন</h3>
        <button class="close-btn" onclick="closeModal('checkout-modal')">&times;</button>
      </div>

      <form id="checkout-form" onsubmit="handleCheckout(event)">
        <div class="form-group">
          <label>আপনার নাম *</label>
          <input type="text" id="cust-name" class="form-control" placeholder="যেমন: মোঃ হাছান" required>
        </div>

        <div class="form-group">
          <label>ফোন নম্বর *</label>
          <input type="tel" id="cust-phone" class="form-control" placeholder="017XXXXXXXX" required>
        </div>

        <div class="form-group">
          <label>সম্পূর্ণ ঠিকানা *</label>
          <textarea id="cust-address" class="form-control" rows="3" placeholder="বাসা/রোড নম্বর, এরিয়া, থানা, জেলা" required></textarea>
        </div>

        <div class="form-group">
          <label>ডেলিভারি এরিয়া *</label>
          <select id="cust-delivery" class="form-control" required>
            <option value="">এরিয়া নির্বাচন করুন</option>
            <option value="inside">ঢাকা শহরের মধ্যে (80 টাকা)</option>
            <option value="outside">ঢাকা শহরের বাইরে (150 টাকা)</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 20px;">
          অর্ডার সাবমিট করুন <i class="fa-solid fa-check"></i>
        </button>
      </form>
    </div>
  </div>

</body>
</html>
